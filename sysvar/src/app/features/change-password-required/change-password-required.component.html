<main class="password-page">
  <section class="password-panel">
    <h1>Alterar senha</h1>
    <p>Você precisa alterar sua senha antes de continuar.</p>
    <form [formGroup]="form" (ngSubmit)="alterar()">
      <label>Senha atual<input type="password" formControlName="senha_atual" autocomplete="current-password" /></label>
      <label>Nova senha<input type="password" formControlName="nova_senha" autocomplete="new-password" /></label>
      <label>Confirmar nova senha<input type="password" formControlName="confirmacao" autocomplete="new-password" /></label>
      <small>A senha deve ter pelo menos 8 caracteres e ser diferente da atual.</small>
      <div class="alert" *ngIf="errorMsg">{{ errorMsg }}</div>
      <div class="actions">
        <button class="btn" type="button" (click)="sair()">Sair</button>
        <button class="btn primary" type="submit" [disabled]="loading">{{ loading ? 'Alterando...' : 'Alterar senha' }}</button>
      </div>
    </form>
  </section>
</main>
